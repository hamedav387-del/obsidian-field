<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obsidian Field - Game Dev</title>
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .logo {
            color: #a855f7;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            line-height: 1.3;
            margin-bottom: 24px;
            background: linear-gradient(135deg, #ffffff 30%, #a855f7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #9ca3af;
            font-size: 1rem;
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

    <div class="logo">
        <span>◻️</span> Obsidian Field
    </div>

    <h1>Welcome to<br>Obsidian Field<br>Game Dev</h1>

    <p>A leading platform for video game development, advanced 3D modeling, and crafting immersive digital experiences.</p>

    <button class="btn">Start Exploring</button>

</body>
</html>
